# Model configuration
[model]
# Path to the ONNX model file
path = "./model"
# Path to the tokenizer JSON file
tokenizer = "./model/tokenizer.json"
# Maximum length of input text (in tokens)
max_input_length = 64
# Inference hardware: "cpu" or "cuda"
inference_hardware = "cpu"
# Model optimization level (0-3)
optimization_level = 3

# Database configuration
[database]
# Path to the LMDB database
path = "./model/embeddings_lmdb"
# LMDB map size in MB
map_size_mb = 1024
# Whether to open LMDB in read-only mode
read_only = true

[performance]
query_cache_capacity = 128
candidate_cache_capacity = 4096

[preference]
enabled = true
persistence_path = "user_preference.json"
blend_weight = 0.12
negative_weight = 0.06
dynamic_min_factor = 0.2
dynamic_max_factor = 1.0
dynamic_softmax_temperature = 0.025
session_weight = 0.45
long_term_weight = 0.55
session_alpha = 0.25
long_term_alpha = 0.08
negative_session_alpha = 0.16
negative_long_term_alpha = 0.05
min_long_term_updates = 3
save_every_updates = 8
